# 태그를 밀면 설치 파일을 만들어 릴리스에 붙인다.
#
# 저장소에는 소스만 올린다 — 설치 파일은 여기(Windows 러너)에서 만들어진다.
# 앱의 자동 업데이트는 이 릴리스가 남기는 `latest.json` 을 본다
# (`src-tauri/tauri.conf.json` 의 `plugins.updater.endpoints`).
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           `~/.tauri/deskboard.key` 의 내용 전체
#
# 키에 비밀번호를 걸었다면 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 도 넣는다. 안 걸었으면
# **만들지 않는다** — GitHub 은 빈 시크릿을 거부하지만, 없는 시크릿은 아래에서 빈 문자열로
# 평가되어 환경 변수가 빈 값으로 전달된다. 비밀번호 없는 키에 맞는 값이 바로 그것이다.
# 서명이 맞지 않는 설치본은 앱이 거부한다 — 이 키를 잃으면 자동 업데이트가 끊긴다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 릴리스를 만들고 파일을 붙이는 데 필요하다

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 빌드가 이 워크플로의 대부분이다 — 캐시가 없으면 매번 처음부터 컴파일한다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 서명 키는 빌드 **맨 끝**에서야 쓰인다 — 잘못 들어가 있으면 20분을 컴파일한 뒤에 죽는다.
      # 몇 초 만에 같은 사실을 알 수 있도록 형식만 먼저 본다. 값은 찍지 않는다(GitHub 이 가리기도 한다).
      - name: 서명 키 시크릿 점검
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY 시크릿이 비어 있습니다. 저장소 Settings → Secrets and variables → Actions 에 등록하세요."
          }
          $k = $env:KEY.Trim()
          Write-Host "키 길이: $($k.Length)자 (정상값은 300자 이상)"
          if ($k -notmatch '^[A-Za-z0-9+/=]+$') {
            throw "키에 base64 가 아닌 문자가 섞여 있습니다. deskboard.key 는 한 줄짜리 base64 입니다 - 파일 내용을 그대로(줄바꿈/따옴표/공백 없이) 넣으세요."
          }
          if (-not $k.StartsWith("dW50cnVzdGVk")) {
            throw "키가 'dW50cnVzdGVk' 로 시작하지 않습니다. 다른 값이 들어갔습니다 - %USERPROFILE%\.tauri\deskboard.key 의 내용인지 확인하세요."
          }
          Write-Host "형식 OK"

      - run: npm ci

      # 깨진 것을 릴리스로 내보내지 않는다.
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: deskboard ${{ github.ref_name }}
          releaseBody: |
            설치: 아래 `deskboard_*_x64-setup.exe` 를 받아 실행하세요.
            이미 쓰고 있다면 설정 → 업데이트에서 바로 받을 수 있습니다.
          # 초안으로 두면 `releases/latest/download/latest.json` 이 404 가 되어
          # 이미 깔린 앱이 이 릴리스를 영영 못 본다.
          releaseDraft: false
          prerelease: false
