[package]
name = "deskboard"
version = "0.1.0"
description = "Desktop widget dashboard for Windows"
authors = ["user"]
edition = "2021"

[lib]
name = "deskboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sysinfo = "0.37"
notify = "8"
notify-debouncer-mini = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
walkdir = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
url = "2"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.58", features = [
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
