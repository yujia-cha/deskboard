# 태그를 밀면 설치 파일을 만들어 릴리스에 붙인다.
#
# 저장소에는 소스만 올린다 — 설치 파일은 여기(Windows 러너)에서 만들어진다.
# 앱의 자동 업데이트는 이 릴리스가 남기는 `latest.json` 을 본다
# (`src-tauri/tauri.conf.json` 의 `plugins.updater.endpoints`).
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           `~/.tauri/deskboard.key` 의 내용 전체
#
# 키에 비밀번호를 걸었다면 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 도 넣는다. 안 걸었으면
# **만들지 않는다** — GitHub 은 빈 시크릿을 거부하지만, 없는 시크릿은 아래에서 빈 문자열로
# 평가되어 환경 변수가 빈 값으로 전달된다. 비밀번호 없는 키에 맞는 값이 바로 그것이다.
# 서명이 맞지 않는 설치본은 앱이 거부한다 — 이 키를 잃으면 자동 업데이트가 끊긴다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 릴리스를 만들고 파일을 붙이는 데 필요하다

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 빌드가 이 워크플로의 대부분이다 — 캐시가 없으면 매번 처음부터 컴파일한다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 서명 키는 빌드 **맨 끝**에서야 쓰인다 — 잘못 들어가 있으면 20분을 컴파일한 뒤에 죽는다.
      # 몇 초 만에 같은 사실을 알 수 있도록 형식만 먼저 본다. 값은 찍지 않는다(GitHub 이 가리기도 한다).
      - name: 서명 키 시크릿 점검
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY 시크릿이 비어 있습니다. 저장소 Settings → Secrets and variables → Actions 에 등록하세요."
          }
          $k = $env:KEY.Trim()
          Write-Host "키 길이: $($k.Length)자 (정상값은 300자 이상)"
          if ($k -notmatch '^[A-Za-z0-9+/=]+$') {
            throw "키에 base64 가 아닌 문자가 섞여 있습니다. deskboard.key 는 한 줄짜리 base64 입니다 - 파일 내용을 그대로(줄바꿈/따옴표/공백 없이) 넣으세요."
          }
          if (-not $k.StartsWith("dW50cnVzdGVk")) {
            throw "키가 'dW50cnVzdGVk' 로 시작하지 않습니다. 다른 값이 들어갔습니다 - %USERPROFILE%\.tauri\deskboard.key 의 내용인지 확인하세요."
          }
          Write-Host "형식 OK"

      - run: npm ci

      # 깨진 것을 릴리스로 내보내지 않는다.
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # --- Windows 코드 서명 (인증서가 있을 때만) ---
      #
      # 지금은 인증서가 없다 → 설치 파일에 Authenticode 서명이 없고, 브라우저로 받아 실행하면
      # SmartScreen 이 "알 수 없는 게시자" 를 띄운다. (업데이터가 내려받는 경로에는 Mark of the
      # Web 이 안 붙어서 그쪽에서는 보통 뜨지 않는다.)
      #
      # 인증서가 생기면 시크릿 두 개만 넣으면 된다 — 이 파일은 고치지 않는다:
      #   WINDOWS_CERTIFICATE           .pfx 파일을 base64 로 인코딩한 문자열
      #   WINDOWS_CERTIFICATE_PASSWORD  그 .pfx 의 비밀번호
      # base64 만들기: [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.pfx")) | Set-Clipboard
      - name: 코드 서명 인증서 준비
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # tauri 에 넘길 설정 조각. 인증서가 없으면 빈 객체라 아무것도 덮어쓰지 않는다.
          $patch = Join-Path $env:RUNNER_TEMP "sign.json"
          if (-not $env:CERT) {
            Write-Host "인증서 시크릿이 없습니다 - 서명 없이 빌드합니다."
            '{}' | Set-Content $patch -Encoding utf8
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $pw = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          Write-Host "인증서 등록: $($cert.Subject)"
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } |
            ConvertTo-Json -Depth 5 | Set-Content $patch -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 서명 설정 조각을 항상 넘긴다 — 인증서가 없으면 `{}` 라 아무 효과가 없다.
          args: --config ${{ runner.temp }}/sign.json
          tagName: ${{ github.ref_name }}
          releaseName: deskboard ${{ github.ref_name }}
          releaseBody: |
            설치: 아래 `deskboard_*_x64-setup.exe` 를 받아 실행하세요.
            이미 쓰고 있다면 설정 → 업데이트에서 바로 받을 수 있습니다.
          # 초안으로 두면 `releases/latest/download/latest.json` 이 404 가 되어
          # 이미 깔린 앱이 이 릴리스를 영영 못 본다.
          releaseDraft: false
          prerelease: false
